<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>奈NA的手机禁闭日常</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.8/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0d0914;
      overflow: hidden;
      font-family: "Zen Maru Gothic", "Kosugi Maru", "Yuanti SC", "圆体-简", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: radial-gradient(circle at 50% 25%, #382247 0%, #20132b 70%, #11081a 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .bg-decor {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 2px solid rgba(255, 180, 210, 0.25);
      border-radius: 28px;
      pointer-events: none;
      z-index: 1;
    }

    .top-header {
      position: absolute;
      top: 16px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 40;
    }
    .header-title {
      color: #ffb8d6;
      font-size: 13.5px;
      font-weight: 900;
      letter-spacing: 1px;
      opacity: 0.9;
    }
    .btn-config {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255, 180, 210, 0.4);
      color: #ffd8ea;
      font-size: 12px;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 12px;
      cursor: pointer;
    }
    .btn-config:active {
      transform: scale(0.92);
    }

    .char-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #live2dCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: pointer;
    }

    .lock-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(20, 10, 30, 0.75);
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .lock-overlay.show { display: flex; }
    .lock-icon { font-size: 48px; animation: lockShake 0.5s infinite alternate; }
    .lock-text { color: #ff9ec6; font-size: 15px; font-weight: 900; margin-top: 10px; letter-spacing: 1px; }
    @keyframes lockShake {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(10deg); }
    }

    .dialogue-wrapper {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      z-index: 29;
      display: flex;
      flex-direction: column;
    }

    .char-name-badge {
      align-self: flex-start;
      margin-left: 20px;
      background: linear-gradient(135deg, #ff6fa3 0%, #d83d83 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      padding: 6px 18px 5px 16px;
      border-radius: 16px 16px 0 0;
      border: 3px solid #ffa4cc;
      border-bottom: none;
      box-shadow: 0 -3px 12px rgba(255, 111, 163, 0.4);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }
    .char-name-badge.user-badge {
      background: linear-gradient(135deg, #70a1ff 0%, #4776e6 100%);
      border-color: #a4c4ff;
      box-shadow: 0 -3px 12px rgba(71, 118, 230, 0.4);
    }

    .badge-icon {
      font-size: 14px;
      animation: pulseMini 1.2s infinite alternate;
    }
    @keyframes pulseMini {
      0% { transform: scale(1); }
      100% { transform: scale(1.3) rotate(10deg); }
    }

    .jelly-dialogue-box {
      position: relative;
      background: linear-gradient(180deg, rgba(46, 26, 61, 0.96) 0%, rgba(28, 14, 38, 0.98) 100%);
      border: 3.5px solid #ff9ec6;
      border-radius: 24px;
      padding: 14px 18px 10px 18px;
      min-height: 124px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6), 
                  inset 0 0 0 1.5px rgba(255, 255, 255, 0.18),
                  inset 0 4px 12px rgba(255, 158, 198, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .jelly-dialogue-box.bounce {
      transform: scale(0.97, 1.03);
    }

    .dialogue-content {
      color: #fff0f7;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.65;
      letter-spacing: 0.6px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      min-height: 56px;
      max-height: 130px;
      overflow-y: auto;
    }
    .dialogue-content.action-mode {
      color: #f1cbe4;
      font-style: italic;
      font-size: 14.5px;
    }

    .dialogue-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1.5px dashed rgba(255, 180, 210, 0.2);
    }
    .footer-left {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .footer-tag {
      font-size: 10px;
      color: #c98baa;
      font-weight: 900;
      letter-spacing: 0.8px;
    }
    .footer-status {
      font-size: 10.5px;
      color: #ff80b3;
      font-weight: 900;
      max-width: 100px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer-right {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .btn-jelly-act {
      background: linear-gradient(135deg, rgba(255, 158, 198, 0.28) 0%, rgba(216, 61, 131, 0.28) 100%);
      border: 1.5px solid #ff9ec6;
      color: #fff0f7;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      box-shadow: 0 2px 6px rgba(255, 111, 163, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-jelly-act:active {
      transform: scale(0.9);
      background: #ff528c;
      color: #ffffff;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .next-indicator {
      font-size: 11px;
      color: #ff80b3;
      font-weight: 900;
      margin-left: 2px;
      animation: bounceNext 1.2s infinite ease-in-out;
      display: none;
    }
    @keyframes bounceNext {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .input-bar-wrapper {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 35;
    }

    .chat-input {
      flex: 1;
      background: rgba(30, 16, 41, 0.92);
      border: 2px solid #d97fae;
      border-radius: 16px;
      padding: 0 14px;
      height: 44px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
      font-family: inherit;
    }
    .chat-input::placeholder {
      color: #8c5773;
      font-weight: normal;
      font-size: 12px;
    }
    .chat-input:focus {
      border-color: #ff9ec6;
    }

    .btn-send {
      background: linear-gradient(135deg, #ff6fa3 0%, #ff4785 100%);
      border: none;
      color: white;
      height: 44px;
      padding: 0 18px;
      border-radius: 16px;
      font-size: 13.5px;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-send:active {
      transform: scale(0.94);
    }

    .opening-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #181124; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    .opening-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .sheep-track { position: relative; width: 100%; height: 140px; }
    .rolling-sheep-box {
      position: absolute; left: -100px; top: 25px;
      animation: rollAndBounce 3.0s cubic-bezier(0.25, 1, 0.35, 1) forwards;
      transform-origin: center bottom;
    }
    @keyframes rollAndBounce {
      0% { left: -100px; transform: translateY(0) scale(1); }
      60% { left: calc(50% - 40px); transform: translateY(0) scale(1); }
      68% { left: calc(50% - 40px); transform: translateY(-30px) scale(1.05, 1.15); }
      76% { left: calc(50% - 40px); transform: translateY(0) scale(1.2, 0.95); }
      85% { left: calc(50% - 40px); transform: translateY(-15px) scale(1.35, 1.45); }
      93% { left: calc(50% - 40px); transform: translateY(0) scale(1.48, 1.35); }
      100% { left: calc(50% - 40px); transform: translateY(0) scale(1.4); }
    }
    .pixel-sheep { image-rendering: pixelated; width: 80px; height: 80px; animation: rotateBody 3.0s cubic-bezier(0.25, 1, 0.35, 1) forwards; }
    @keyframes rotateBody { 0% { transform: rotate(0deg); } 60% { transform: rotate(720deg); } 100% { transform: rotate(720deg); } }

    .sheep-heart {
      position: absolute; top: -18px; right: 4px; font-size: 22px; opacity: 0; transform: scale(0.5); transition: all 0.4s ease; z-index: 10;
    }
    .sheep-heart.pop { opacity: 1; transform: scale(1.2) translateY(-6px); animation: heartBlink 1.4s infinite alternate; }
    @keyframes heartBlink { 0% { transform: scale(1) translateY(-6px); } 100% { transform: scale(1.25) translateY(-10px); } }

    .name-input-panel {
      width: 84%; max-width: 280px; display: flex; flex-direction: column; gap: 10px; margin-top: 12px;
    }
    .name-input {
      background: rgba(255, 255, 255, 0.08); border: 2px solid #ff7ebb; border-radius: 14px; height: 42px; padding: 0 14px; color: #fff; font-size: 14px; font-weight: 900; outline: none; text-align: center; user-select: text; font-family: inherit;
    }
    .name-btn {
      background: linear-gradient(135deg, #ff6fa3 0%, #d83d83 100%); border: none; color: white; height: 42px; border-radius: 14px; font-size: 14px; font-weight: 900; cursor: pointer; font-family: inherit; box-shadow: 0 4px 14px rgba(255, 71, 133, 0.4);
    }
  </style>
</head>
<body>

  <div class="opening-screen" id="openingScreen">
    <div class="sheep-track">
      <div class="rolling-sheep-box">
        <div class="sheep-heart" id="sheepHeart">💖</div>
        <canvas id="sheepCanvas" class="pixel-sheep" width="32" height="32"></canvas>
      </div>
    </div>

    <div class="name-input-panel" id="nameInputPanel">
      <input type="text" id="initPlayerName" class="name-input" placeholder="输入你的名字..." maxlength="12">
      <input type="text" id="initPlayerPersona" class="name-input" placeholder="输入你的人设（如：饲主/学生）..." maxlength="30">
      <button class="name-btn" onclick="submitPlayerProfile()">进入手机世界</button>
    </div>
  </div>

  <div class="viewport">
    <div class="bg-decor"></div>

    <div class="lock-overlay" id="lockOverlay">
      <div class="lock-icon">⛓️🔒</div>
      <div class="lock-text" id="lockTimerText">生气锁链锁定中... (5s)</div>
    </div>

    <div class="top-header">
      <span class="header-title" id="headerTitle">✨ Live2D · 奈NA的动态空间</span>
      <button class="btn-config" onclick="openConfigModal()">⚙️ 设置</button>
    </div>

    <div class="char-stage">
      <canvas id="live2dCanvas"></canvas>
    </div>

    <div class="dialogue-wrapper">
      <div class="char-name-badge" id="nameBadge">
        <span class="badge-icon">💖</span>
        <span id="badgeName">奈</span>
      </div>
      <div class="jelly-dialogue-box" id="dialogueBox" onclick="onDialogueBoxClick()">
        <div class="dialogue-content" id="dialogueContent">
          喂！你在玻璃外面看什么看啊？哼，还不快点把本王子从这个奇怪的盒子里放出去！
        </div>
        <div class="dialogue-footer">
          <div class="footer-left">
            <span class="footer-tag" id="footerTag">NA'S DIALOGUE</span>
            <span class="footer-status" id="statusText">等待回应...</span>
          </div>
          <div class="footer-right">
            <button class="btn-jelly-act" onclick="prevSentence(event)" title="回退上一句">🐾 上句</button>
            <button class="btn-jelly-act" id="btnPlayVoice" onclick="onPlayVoiceClick(event)" title="朗读当前短句">🌸 朗读</button>
            <button class="btn-jelly-act" id="btnDownloadVoice" onclick="downloadCurrentVoice(event)" style="display:none;">💌 下载</button>
            <button class="btn-jelly-act" id="btnRetryVoice" onclick="onRetryVoiceClick(event)">✨ 语音</button>
            <button class="btn-jelly-act" id="btnRerollStory" onclick="onRerollStoryClick(event)">💫 重答</button>
            <span class="next-indicator" id="nextIndicator">轻触继续 ▼</span>
          </div>
        </div>
      </div>
    </div>

    <div class="input-bar-wrapper">
      <input type="text" id="userInput" class="chat-input" placeholder="输入一句话，按回车放入对话框..." onkeydown="handleInputKeyDown(event)">
      <button class="btn-send" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="configModal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 99999; display: none; align-items: center; justify-content: center;">
    <div style="width: 92%; max-width: 420px; max-height: 90vh; overflow-y: auto; background: #231430; border: 3px solid #ff9ec6; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px;">
      
      <div style="color: #ffb8d6; font-size: 16px; font-weight: 900; text-align: center;">⚙️ 核心设置</div>

      <div style="background: rgba(0,0,0,0.25); border: 1.5px solid #ff7ebb; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: #ff9ec6; font-size: 12.5px; font-weight: 900;">👤 玩家身份</span>
          <button type="button" onclick="resetOpeningProfile()" style="background: #ba5bb0; color: #fff; border: none; border-radius: 6px; font-size: 10px; font-weight: bold; padding: 2px 6px; cursor: pointer;">✨ 重置开屏身份</button>
        </div>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="cfgPlayerName" placeholder="玩家姓名" style="flex: 1; background: #14091c; border: 1.5px solid #8e496d; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
          <input type="text" id="cfgPlayerPersona" placeholder="玩家人设身份" style="flex: 1.6; background: #14091c; border: 1.5px solid #8e496d; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
        </div>
      </div>

      <div style="background: rgba(0,0,0,0.25); border: 1.5px solid #e06bb2; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
        <div style="color: #ff9ec6; font-size: 12.5px; font-weight: 900;">🖋️ 字数规则设置</div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
          <span style="color: #ffd6eb; font-size: 11px; white-space: nowrap;">单轮回复总字数:</span>
          <div style="display: flex; align-items: center; gap: 4px; flex: 1;">
            <input type="number" id="cfgWordMin" placeholder="350" style="width: 50%; background: #14091c; border: 1.5px solid #8e496d; border-radius: 8px; height: 30px; text-align: center; color: #fff; font-size: 11.5px; outline: none;">
            <span style="color: #ff9ec6; font-size: 11px;">~</span>
            <input type="number" id="cfgWordMax" placeholder="500" style="width: 50%; background: #14091c; border: 1.5px solid #8e496d; border-radius: 8px; height: 30px; text-align: center; color: #fff; font-size: 11.5px; outline: none;">
          </div>
        </div>
        <textarea id="cfgCustomStyle" rows="2" placeholder="自定义文风覆盖..." style="background: #14091c; border: 1.5px solid #e06bb2; border-radius: 8px; color: #fff; font-size: 11px; padding: 6px; outline: none; resize: none;"></textarea>
      </div>

      <div style="background: rgba(0,0,0,0.25); border: 1.5px solid #8e496d; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
        <div style="color: #ff9ec6; font-size: 12.5px; font-weight: 900;">🧠 对话模型配置</div>
        <input type="text" id="cfgChatBase" placeholder="Base URL: https://api.openai.com/v1" style="background: #14091c; border: 1.5px solid #8e496d; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
        <input type="password" id="cfgChatKey" placeholder="API Key: sk-..." style="background: #14091c; border: 1.5px solid #8e496d; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
      </div>

      <div style="background: rgba(0,0,0,0.25); border: 1.5px solid #ba5bb0; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
        <div style="color: #ffb8d6; font-size: 12.5px; font-weight: 900;">🎙️ MiniMax 配音配置</div>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="cfgMiniMaxGroupId" placeholder="GroupId" style="flex: 1; background: #14091c; border: 1.5px solid #ba5bb0; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
          <input type="password" id="cfgMiniMaxVoiceKey" placeholder="语音 Key" style="flex: 1.4; background: #14091c; border: 1.5px solid #ba5bb0; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
        </div>
        <input type="text" id="cfgVoiceId" placeholder="Voice ID" style="background: #14091c; border: 1.5px solid #ba5bb0; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
      </div>

      <div style="display: flex; gap: 10px;">
        <button type="button" onclick="closeConfigModal()" style="flex: 1; height: 36px; border-radius: 12px; border: none; font-weight: bold; background: #4a2856; color: #ffd6eb; cursor: pointer;">取消</button>
        <button type="button" onclick="saveConfig()" style="flex: 1; height: 36px; border-radius: 12px; border: none; font-weight: bold; background: #ff528c; color: white; cursor: pointer;">保存配置</button>
      </div>

    </div>
  </div>

  <script>
    let live2dApp = null;
    let live2dModel = null;
    let isSpeaking = false;

    let baseScale = 1.0;
    let targetCameraScaleMult = 1.0;
    let currentCameraScaleMult = 1.0;
    let targetCameraOffsetY = 0;
    let currentCameraOffsetY = 0;

    let lifeFrame = 0;
    let blinkValue = 1.0;
    let nextBlinkFrame = 90;
    let mouthOpenValue = 0;
    let mouthTargetValue = 0;
    let mouthToggleTimer = 0;

    let clickComboCount = 0;
    let comboResetTimer = null;
    let isLocked = false;

    const TOUCH_DIALOGUES = {
      head: [
        { act: "（你伸手轻轻摸了摸奈粉色的水母头和头顶的心形呆毛，他浑身一颤，耳尖瞬间烧得通红）", talk: "喂！别随随便便摸我啊... ", emo: "SHY" },
        { act: "（你顺着他的头发轻柔地梳理，奈原本想要推开的手慢慢垂了下来，水润的猫眼里泛起光亮）", talk: "但是...你的手好温暖~", emo: "HEART" },
        { act: "（你捏了捏他毛茸茸的大垂羊耳，奈头顶的心形呆毛瞬间旋转起来，整个人羞恼得直跺脚）", talk: "嗯~我才没有很舒服呢~", emo: "HEART" },
        { act: "（你作势要收回手，奈却下意识地把脑袋往你手指的方向又凑近了一分）", talk: "喂！干嘛随随便便打算停下不摸我了...", emo: "POUT" }

    function bindModelTouchInteractions() {
      if (!live2dModel) return;
      live2dModel.interactive = true;
      live2dModel.buttonMode = true;

      live2dModel.on('pointerdown', (event) => {
        if (isLocked) return;

        const point = event.data.global;
        const localPoint = live2dModel.toLocal(point);
        
        let targetPart = 'body';
        if (localPoint.y < -30) targetPart = 'head';
        else if (localPoint.y >= -30 && localPoint.y <= 40) targetPart = 'horn';

        triggerTouchReaction(targetPart);
      });
    }

    function triggerTouchReaction(part) {
      clickComboCount++;
      if (comboResetTimer) clearTimeout(comboResetTimer);
      comboResetTimer = setTimeout(() => { clickComboCount = 0; }, 1500);

      let item = null;

      if (clickComboCount >= 10) {
        item = TOUCH_DIALOGUES.combo10[0];
        triggerChainLock();
        clickComboCount = 0;
      } else {
        const list = TOUCH_DIALOGUES[part] || TOUCH_DIALOGUES.body;
        const index = (clickComboCount - 1) % list.length;
        item = list[index];
      }

      setModelExpression(item.emo);

      scriptQueue = [
        { speaker: 'ACT', emo: item.emo, text: item.act },
        { speaker: 'NA', emo: item.emo, zh: item.talk, ja: item.talk }
      ];
      showSentence(0);
      statusText.textContent = clickComboCount > 1 ? `连击 x${clickComboCount}!` : "触碰互动";
    }

    function triggerChainLock() {
      isLocked = true;
      const overlay = document.getElementById('lockOverlay');
      const timerText = document.getElementById('lockTimerText');
      overlay.classList.add('show');

      let timeLeft = 5;
      timerText.textContent = `生气锁链锁定中... (${timeLeft}s)`;

      const lockInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerText.textContent = `生气锁链锁定中... (${timeLeft}s)`;
        } else {
          clearInterval(lockInterval);
          isLocked = false;
          overlay.classList.remove('show');
          setModelExpression("IDLE");
        }
      }, 1000);
    }

    function bindPixiNativePipeline() {
      if (!live2dModel || !live2dModel.internalModel || !live2dModel.internalModel.coreModel) return;
      const core = live2dModel.internalModel.coreModel;
      const stage = document.querySelector('.char-stage');

      try {
        if (live2dModel.motion) live2dModel.motion('待机');
      } catch (e) {}

      live2dApp.ticker.add((delta) => {
        lifeFrame += delta;

        if (lifeFrame >= nextBlinkFrame) {
          blinkValue -= 0.08 * delta;
          if (blinkValue <= 0) {
            blinkValue = 0;
            lifeFrame = 0;
            nextBlinkFrame = Math.floor(Math.random() * 120) + 90;
          }
        } else if (blinkValue < 1.0) {
          blinkValue = Math.min(1.0, blinkValue + 0.1 * delta);
        }

        currentCameraScaleMult += (targetCameraScaleMult - currentCameraScaleMult) * 0.08 * delta;
        currentCameraOffsetY += (targetCameraOffsetY - currentCameraOffsetY) * 0.08 * delta;
        live2dModel.scale.set(baseScale * currentCameraScaleMult);
        live2dModel.y = (stage.clientHeight * 0.53) + currentCameraOffsetY;

        if (isSpeaking) {
          mouthToggleTimer += delta;
          if (mouthToggleTimer > 9) {
            mouthTargetValue = (mouthTargetValue > 0.4) ? 0.1 : 0.85;
            mouthToggleTimer = 0;
          }
        } else {
          mouthTargetValue = 0;
        }
        mouthOpenValue += (mouthTargetValue - mouthOpenValue) * 0.25 * delta;

        try {
          core.setParameterValueById('ParamEyeLOpen', blinkValue);
          core.setParameterValueById('ParamEyeROpen', blinkValue);
          core.setParameterValueById('ParamMouthOpenY', mouthOpenValue);
          core.setParameterValueById('ParamMouthForm', 0.65);

          const time = lifeFrame * 0.04;
          if (isSpeaking) {
            const headTilt = Math.sin(time * 1.6) * 7.5;
            const bodyTilt = Math.sin(time * 1.6) * 3.2;
            core.setParameterValueById('ParamAngleZ', headTilt);
            core.setParameterValueById('ParamBodyAngleZ', bodyTilt);
            core.setParameterValueById('ParamAngleX', Math.cos(time * 1.6) * 4.5);
          } else {
            const headIdle = Math.sin(time * 0.8) * 2.2;
            const bodyIdle = Math.sin(time * 0.8) * 1.2;
            core.setParameterValueById('ParamAngleZ', headIdle);
            core.setParameterValueById('ParamBodyAngleZ', bodyIdle);
            core.setParameterValueById('ParamAngleX', headIdle * 0.4);
          }

          const breath = Math.sin(time * 0.9) * 0.35 + 0.5;
          core.setParameterValueById('ParamBreath', breath);
        } catch (e) {}
      });
    }

    function parseStoryScript(rawReply) {
      const lines = rawReply.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const queue = [];

      lines.forEach(line => {
        const actMatch = line.match(/^\[ACT:([A-Z0-9_]+)\]\s*(.*)$/);
        const talkMatch = line.match(/^\[TALK:([A-Z0-9_]+)\]\s*(.*)$/);

        if (actMatch) {
          let text = actMatch[2].trim();
          while (text.length > 40) {
            queue.push({ speaker: 'ACT', emo: actMatch[1], text: text.substring(0, 40) });
            text = text.substring(40);
          }
          if (text) queue.push({ speaker: 'ACT', emo: actMatch[1], text: text });
        } else if (talkMatch) {
          const parts = talkMatch[2].split('|');
          let zh = (parts[0] || '').trim();
          let ja = (parts[1] || zh).trim();
          while (zh.length > 15) {
            queue.push({ speaker: 'NA', emo: talkMatch[1], zh: zh.substring(0, 15), ja: ja.substring(0, 15) });
            zh = zh.substring(15);
            ja = ja.substring(15);
          }
          if (zh) queue.push({ speaker: 'NA', emo: talkMatch[1], zh: zh, ja: ja });
        }
      });
      return queue;
    }

    async function synthesizeMiniMaxVoice(textToSpeak) {
      const chatKey = localStorage.getItem('nai_chat_key');
      const voiceKey = localStorage.getItem('nai_minimax_voice_key');
      const mmKey = voiceKey || chatKey;
      const mmGroup = localStorage.getItem('nai_minimax_group');
      const mmModel = localStorage.getItem('nai_minimax_voice_model') || 'speech-2.8-hd';
      const voiceId = localStorage.getItem('nai_minimax_voice') || 'moss_audio_120';
      const speed = parseFloat(localStorage.getItem('nai_minimax_voice_speed') || '1.0');
      const pitch = parseInt(localStorage.getItem('nai_minimax_voice_pitch') || '0', 10);

      if (!mmKey || !mmGroup) {
        alert("请先设置 MiniMax API Key 和 Group ID！");
        openConfigModal();
        return;
      }

      const correctedText = textToSpeak.replace(/NA/g, 'な').replace(/Na/g, 'な').replace(/na/g, 'な');

      statusText.textContent = "🎙️ 合成中...";

      try {
        const res = await fetch(`https://api.minimax.chat/v1/t2a_v2?GroupId=${encodeURIComponent(mmGroup)}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${mmKey}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: mmModel, text: correctedText, stream: false,
            voice_setting: { voice_id: voiceId, speed: speed, vol: 1.0, pitch: pitch },
            audio_setting: { sample_rate: 32000, bitrate: 128000, format: "mp3", channel: 1 }
          })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.data && data.data.audio) {
          const hex = data.data.audio;
          const bytes = new Uint8Array(hex.match(/[\da-f]{2}/gi).map(h => parseInt(h, 16)));
          currentVoiceBlob = new Blob([bytes], { type: 'audio/mp3' });

          audioPlayer.src = URL.createObjectURL(currentVoiceBlob);
          audioPlayer.play();
          statusText.textContent = "🔊 说话中...";
          btnDownloadVoice.style.display = 'inline-flex';

          audioPlayer.onplay = () => { startModelLipSync(); };
          audioPlayer.onended = () => { stopModelLipSync(); statusText.textContent = "播放完毕"; };
        }
      } catch (err) { statusText.textContent = "合成出错"; }
    }

      const lang = localStorage.getItem('nai_minimax_voice_lang') || 'ja';
      synthesizeMiniMaxVoice((lang === 'zh') ? item.zh : item.ja);

      if (!currentVoiceBlob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(currentVoiceBlob);
      a.download = `奈NA_${Date.now()}.mp3`;
      a.click();
    }

    let lastSentUserText = "";
    async function sendMessage(isReroll = false) {
      let textToSend = "";
      if (isReroll) {
        textToSend = lastSentUserText;
      } else {
        const inputVal = userInput.value.trim();
        if (inputVal) { pendingUserInputs.push(inputVal); userInput.value = ''; }
        if (pendingUserInputs.length === 0) return;
        textToSend = pendingUserInputs.join('；');
        pendingUserInputs = [];
        lastSentUserText = textToSend;
      }

      const chatKey = localStorage.getItem('nai_chat_key');
      const chatBase = localStorage.getItem('nai_chat_base') || 'https://api.openai.com/v1';
      const chatModel = localStorage.getItem('nai_chat_model') || 'gpt-4o-mini';

      if (!chatKey) { alert("请先设置 API Key！"); openConfigModal(); return; }

      statusText.textContent = "奈思考中...";
      if (!isReroll) chatHistory.push({ role: "user", content: `【${playerName}】: ${textToSend}` });

      try {
        const response = await fetch(chatBase.replace(/\/+$/, '') + '/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${chatKey}` },
          body: JSON.stringify({ model: chatModel, messages: chatHistory, temperature: 0.85 })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const resData = await response.json();
        const rawReply = resData.choices[0].message.content.trim();

        if (isReroll) { chatHistory[chatHistory.length - 1] = { role: "assistant", content: rawReply }; }
        else { chatHistory.push({ role: "assistant", content: rawReply }); }

        scriptQueue = parseStoryScript(rawReply);
        if (scriptQueue.length > 0) showSentence(0);
      } catch (err) {
        dialogueContent.textContent = "网络连接失败，请检查 API 配置。";
        statusText.textContent = "连接异常";
      }
    }

    function onRerollStoryClick(e) { e.stopPropagation(); if (!lastSentUserText) return; sendMessage(true); }

    const configModal = document.getElementById('configModal');
    const cfgPlayerName = document.getElementById('cfgPlayerName');
    const cfgPlayerPersona = document.getElementById('cfgPlayerPersona');
    const cfgWordMin = document.getElementById('cfgWordMin');
    const cfgWordMax = document.getElementById('cfgWordMax');
    const cfgCustomStyle = document.getElementById('cfgCustomStyle');
    const cfgChatBase = document.getElementById('cfgChatBase');
    const cfgChatKey = document.getElementById('cfgChatKey');
    const cfgChatModel = document.getElementById('cfgChatModel');
    const cfgMiniMaxGroupId = document.getElementById('cfgMiniMaxGroupId');
    const cfgMiniMaxVoiceKey = document.getElementById('cfgMiniMaxVoiceKey');
    const cfgVoiceId = document.getElementById('cfgVoiceId');
    const fetchStatus = document.getElementById('fetchStatus');

    function loadSavedConfig() {
      if (cfgPlayerName) cfgPlayerName.value = localStorage.getItem('nai_player_name') || '';
      if (cfgPlayerPersona) cfgPlayerPersona.value = localStorage.getItem('nai_player_persona') || '普通人类';
      if (cfgWordMin) cfgWordMin.value = localStorage.getItem('nai_word_min') || '350';
      if (cfgWordMax) cfgWordMax.value = localStorage.getItem('nai_word_max') || '500';
      if (cfgCustomStyle) cfgCustomStyle.value = localStorage.getItem('nai_custom_style') || '';
      if (cfgChatBase) cfgChatBase.value = localStorage.getItem('nai_chat_base') || 'https://api.openai.com/v1';
      if (cfgChatKey) cfgChatKey.value = localStorage.getItem('nai_chat_key') || '';
      if (cfgChatModel) cfgChatModel.value = localStorage.getItem('nai_chat_model') || 'gpt-4o-mini';
      if (cfgMiniMaxGroupId) cfgMiniMaxGroupId.value = localStorage.getItem('nai_minimax_group') || '';
      if (cfgMiniMaxVoiceKey) cfgMiniMaxVoiceKey.value = localStorage.getItem('nai_minimax_voice_key') || '';
      if (cfgVoiceId) cfgVoiceId.value = localStorage.getItem('nai_minimax_voice') || 'moss_audio_120';
    }

    function openConfigModal() { loadSavedConfig(); configModal.style.display = 'flex'; }
    function closeConfigModal() { configModal.style.display = 'none'; }

    function saveConfig() {
      playerName = cfgPlayerName.value.trim() || '你';
      playerPersona = cfgPlayerPersona.value.trim() || '普通人类';
      localStorage.setItem('nai_player_name', playerName);
      localStorage.setItem('nai_player_persona', playerPersona);
      localStorage.setItem('nai_word_min', cfgWordMin.value.trim() || '350');
      localStorage.setItem('nai_word_max', cfgWordMax.value.trim() || '500');
      localStorage.setItem('nai_custom_style', cfgCustomStyle.value);
      localStorage.setItem('nai_chat_base', cfgChatBase.value.trim());
      localStorage.setItem('nai_chat_key', cfgChatKey.value.trim());
      localStorage.setItem('nai_chat_model', cfgChatModel.value.trim());
      localStorage.setItem('nai_minimax_group', cfgMiniMaxGroupId.value.trim());
      localStorage.setItem('nai_minimax_voice_key', cfgMiniMaxVoiceKey.value.trim());
      localStorage.setItem('nai_minimax_voice', cfgVoiceId.value.trim());
      initSystemPrompt();
      closeConfigModal();
      alert("配置已保存！");
    }

    loadSavedConfig();
    initSystemPrompt();
    handleOpeningFlow();
    window.addEventListener('DOMContentLoaded', () => { initLive2D(); });
  </script>
</body>
</html>
