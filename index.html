<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>奈NA的手机禁闭日常</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.8/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; height: 100dvh; background: #0d0914; overflow: hidden; font-family: "Zen Maru Gothic", "Kosugi Maru", sans-serif; -webkit-font-smoothing: antialiased; }
    .viewport { position: relative; width: 100vw; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; background: radial-gradient(circle at 50% 25%, #382247 0%, #20132b 70%, #11081a 100%); overflow: hidden; display: flex; flex-direction: column; }
    .bg-decor { position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; border: 2px solid rgba(255, 180, 210, 0.25); border-radius: 28px; pointer-events: none; z-index: 1; }
    .top-header { position: absolute; top: 16px; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 40; }
    .header-title { color: #ffb8d6; font-size: 13.5px; font-weight: 900; letter-spacing: 1px; }
    .btn-config { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(6px); border: 1.5px solid rgba(255, 180, 210, 0.4); color: #ffd8ea; font-size: 12px; font-weight: 900; padding: 5px 12px; border-radius: 12px; cursor: pointer; }
    .char-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; justify-content: center; align-items: center; }
    #live2dCanvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

    .lock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 10, 30, 0.75); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .lock-overlay.show { display: flex; }
    .lock-icon { font-size: 48px; animation: lockShake 0.5s infinite alternate; }
    .lock-text { color: #ff9ec6; font-size: 15px; font-weight: 900; margin-top: 10px; }
    @keyframes lockShake { 0% { transform: rotate(-10deg); } 100% { transform: rotate(10deg); } }

    .dialogue-wrapper { position: absolute; bottom: 82px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 420px; z-index: 29; display: flex; flex-direction: column; }
    .char-name-badge { align-self: flex-start; margin-left: 20px; background: linear-gradient(135deg, #ff6fa3 0%, #d83d83 100%); color: #fff; font-size: 14px; font-weight: 900; padding: 6px 18px 5px 16px; border-radius: 16px 16px 0 0; border: 3px solid #ffa4cc; border-bottom: none; box-shadow: 0 -3px 12px rgba(255, 111, 163, 0.4); display: flex; align-items: center; gap: 6px; z-index: 2; }
    .char-name-badge.user-badge { background: linear-gradient(135deg, #70a1ff 0%, #4776e6 100%); border-color: #a4c4ff; }
    .jelly-dialogue-box { position: relative; background: linear-gradient(180deg, rgba(46, 26, 61, 0.96) 0%, rgba(28, 14, 38, 0.98) 100%); border: 3.5px solid #ff9ec6; border-radius: 24px; padding: 14px 18px 10px 18px; min-height: 124px; box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
    .dialogue-content { color: #fff0f7; font-size: 15px; font-weight: 900; line-height: 1.65; letter-spacing: 0.6px; min-height: 56px; max-height: 130px; overflow-y: auto; }
    .dialogue-content.action-mode { color: #f1cbe4; font-style: italic; font-size: 14.5px; }
    .dialogue-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1.5px dashed rgba(255, 180, 210, 0.2); }
    .footer-left { display: flex; gap: 6px; align-items: center; }
    .footer-tag { font-size: 10px; color: #c98baa; font-weight: 900; }
    .footer-status { font-size: 10.5px; color: #ff80b3; font-weight: 900; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .footer-right { display: flex; gap: 5px; align-items: center; }
    .btn-jelly-act { background: linear-gradient(135deg, rgba(255, 158, 198, 0.28) 0%, rgba(216, 61, 131, 0.28) 100%); border: 1.5px solid #ff9ec6; color: #fff0f7; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 12px; cursor: pointer; }
    .next-indicator { font-size: 11px; color: #ff80b3; font-weight: 900; margin-left: 2px; display: none; }

    .input-bar-wrapper { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 420px; display: flex; align-items: center; gap: 8px; z-index: 35; }
    .chat-input { flex: 1; background: rgba(30, 16, 41, 0.92); border: 2px solid #d97fae; border-radius: 16px; padding: 0 14px; height: 44px; color: #fff; font-size: 14px; font-weight: 900; outline: none; }
    .btn-send { background: linear-gradient(135deg, #ff6fa3 0%, #ff4785 100%); border: none; color: white; height: 44px; padding: 0 18px; border-radius: 16px; font-size: 13.5px; font-weight: 900; cursor: pointer; }

    .opening-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #181124; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .opening-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; transition: 0.8s; }
    .sheep-track { position: relative; width: 100%; height: 140px; }
    .rolling-sheep-box { position: absolute; left: -100px; top: 25px; animation: rollAndBounce 3.0s forwards; transform-origin: center bottom; }
    @keyframes rollAndBounce { 0% { left: -100px; } 60% { left: calc(50% - 40px); } 100% { left: calc(50% - 40px); } }
    .pixel-sheep { image-rendering: pixelated; width: 80px; height: 80px; }
    .name-input-panel { width: 84%; max-width: 280px; display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .name-input { background: rgba(255, 255, 255, 0.08); border: 2px solid #ff7ebb; border-radius: 14px; height: 42px; padding: 0 14px; color: #fff; font-size: 14px; font-weight: 900; text-align: center; outline: none; }
    .name-btn { background: linear-gradient(135deg, #ff6fa3 0%, #d83d83 100%); border: none; color: white; height: 42px; border-radius: 14px; font-size: 14px; font-weight: 900; cursor: pointer; }
  </style>
</head>
<body>

  <div class="opening-screen" id="openingScreen">
    <div class="sheep-track">
      <div class="rolling-sheep-box">
        <canvas id="sheepCanvas" class="pixel-sheep" width="32" height="32"></canvas>
      </div>
    </div>
    <div class="name-input-panel" id="nameInputPanel">
      <input type="text" id="initPlayerName" class="name-input" placeholder="输入你的名字..." maxlength="12">
      <input type="text" id="initPlayerPersona" class="name-input" placeholder="输入你的人设..." maxlength="30">
      <button class="name-btn" onclick="submitPlayerProfile()">进入手机世界</button>
    </div>
  </div>

  <div class="viewport">
    <div class="bg-decor"></div>
    <div class="lock-overlay" id="lockOverlay">
      <div class="lock-icon">⛓️🔒</div>
      <div class="lock-text" id="lockTimerText">生气锁链锁定中... (5s)</div>
    </div>

    <div class="top-header">
      <span class="header-title" id="headerTitle">✨ Live2D · 奈NA的动态空间</span>
      <button class="btn-config" onclick="openConfigModal()">⚙️ 设置</button>
    </div>

    <div class="char-stage">
      <canvas id="live2dCanvas"></canvas>
    </div>

    <div class="dialogue-wrapper">
      <div class="char-name-badge" id="nameBadge">
        <span class="badge-icon">💖</span>
        <span id="badgeName">奈</span>
      </div>
      <div class="jelly-dialogue-box" id="dialogueBox" onclick="onDialogueBoxClick()">
        <div class="dialogue-content" id="dialogueContent">
          喂！你在玻璃外面看什么看啊？哼，还不快点把本王子从这个奇怪的盒子里放出去！
        </div>
        <div class="dialogue-footer">
          <div class="footer-left">
            <span class="footer-tag" id="footerTag">NA'S DIALOGUE</span>
            <span class="footer-status" id="statusText">等待回应...</span>
          </div>
          <div class="footer-right">
            <button class="btn-jelly-act" onclick="prevSentence(event)">🐾 上句</button>
            <button class="btn-jelly-act" id="btnPlayVoice" onclick="onPlayVoiceClick(event)">🌸 朗读</button>
            <button class="btn-jelly-act" id="btnRetryVoice" onclick="onRetryVoiceClick(event)">✨ 语音</button>
            <button class="btn-jelly-act" id="btnRerollStory" onclick="onRerollStoryClick(event)">💫 重答</button>
            <span class="next-indicator" id="nextIndicator">轻触继续 ▼</span>
          </div>
        </div>
      </div>
    </div>

    <div class="input-bar-wrapper">
      <input type="text" id="userInput" class="chat-input" placeholder="输入一句话，按回车..." onkeydown="handleInputKeyDown(event)">
      <button class="btn-send" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="configModal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 99999; display: none; align-items: center; justify-content: center;">
    <div style="width: 92%; max-width: 420px; background: #231430; border: 3px solid #ff9ec6; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px;">
      <div style="color: #ffb8d6; font-size: 16px; font-weight: 900; text-align: center;">⚙️ 核心设置</div>
      <input type="text" id="cfgPlayerName" placeholder="玩家姓名" style="background:#14091c; border:1.5px solid #8e496d; border-radius:8px; height:32px; padding:0 8px; color:#fff; font-size:12px;">
      <input type="password" id="cfgChatKey" placeholder="API Key: sk-..." style="background:#14091c; border:1.5px solid #8e496d; border-radius:8px; height:32px; padding:0 8px; color:#fff; font-size:12px;">
      <div style="display: flex; gap: 10px;">
        <button type="button" onclick="closeConfigModal()" style="flex:1; height:36px; border-radius:12px; border:none; background:#4a2856; color:#ffd6eb;">取消</button>
        <button type="button" onclick="saveConfig()" style="flex:1; height:36px; border-radius:12px; border:none; background:#ff528c; color:#fff;">保存</button>
      </div>
    </div>
  </div>

  <script>
    let live2dApp = null;
    let live2dModel = null;
    let isSpeaking = false;
    let baseScale = 1.0;
    let targetCameraScaleMult = 1.0;
    let currentCameraScaleMult = 1.0;
    let targetCameraOffsetY = 0;
    let currentCameraOffsetY = 0;

    let lifeFrame = 0;
    let blinkValue = 1.0;
    let nextBlinkFrame = 90;
    let mouthOpenValue = 0;
    let mouthTargetValue = 0;
    let mouthToggleTimer = 0;

    let clickComboCount = 0;
    let comboResetTimer = null;
    let isLocked = false;

    // 完美实装你设计的触碰台词库（内置对应的纯日文发音文本，确保 MiniMax 朗读日乙声线）
    const TOUCH_DIALOGUES = {
      head: [
        { act: "（你伸手轻轻摸了摸奈粉色的水母头和头顶的心形呆毛，他浑身一颤，耳尖瞬间烧得通红）", talk: "喂！别随随便便摸我啊... ", jaTalk: "おい！勝手に触るなよ…", emo: "脸红" },
        { act: "（你顺着他的头发轻柔地梳理，奈原本想要推开的手慢慢垂了下来，水润的猫眼里泛起光亮）", talk: "但是...你的手好温暖~", emo: "爱心眼" , jaTalk: "でも…君の手、暖かいね…"},
        { act: "（你捏了捏他毛茸茸的大垂羊耳，奈头顶的心形呆毛瞬间旋转起来，整个人羞恼得直跺脚）", talk: "嗯~我才没有很舒服呢~", emo: "呆毛旋转", jaTalk: "んっ…気持ちよくなんかないもん！" },
        { act: "（你作势要收回手，奈却下意识地把脑袋往你手指的方向又凑近了一分）", talk: "喂！干嘛随随便便打算停下不摸我了...", emo: "生气", jaTalk: "ちょっと！なんで勝手にやめるのさ…" }
      ],
      horn: [
        { act: "（你轻轻碰了碰他脑袋两侧通透的粉色水晶羊角，奈立刻挺起小胸脯，一脸骄傲地扬起下巴）", talk: "哈哈！你们人类没有吧~这可是本王子最引以为傲地角哦~", emo: "星星眼", jaTalk: "ははー！人間にはないだろ？ボクの自慢の角なんだからね！" },
        { act: "（你好奇地多抚摸了两下水晶角，奈狐疑地盯着你，眼神里满是警惕与嫌弃）", talk: "什么? 你还要摸吗？你洗手了吧....", emo: "黑脸", jaTalk: "なに？まだ触る気？ちゃんと手を洗ったよね…？" },
        { act: "（你假装要认真擦手再摸，奈红着脸小声嘟囔，眼神飘忽不定）", talk: "...只摸一下的话...好...好吧...", emo: "脸红", jaTalk: "…一回だけなら…しょ、しょうがないなぁ…" }
      ],
      body: [
        { act: "（你轻轻戳了戳他薄荷绿裹胸吊带的边缘，奈像触电一样猛地往后一弹，满脸通红地捂住胸口）", talk: "不可以！绝对不可以！你怎么能随随便便....碰...那里...", emo: "生气", jaTalk: "だめ！絶対だめ！そんなところ勝手に触るなよ…！" },
        { act: "（你又坏笑着戳了一下，奈急得眼眶泛泪，呆毛转成螺旋桨，小手在身前疯狂挥舞）", talk: "我都说了...不行...不要这样啦....", emo: "哭哭", jaTalk: "もう…やめてって言ったでしょ…！" },
        { act: "（你顺势用指尖轻轻环住他的腰侧，奈瞬间卸下所有防备，身体软绵绵地靠过来，顺势抱住抱枕）", talk: "很...很舒服哦~多摸摸我吧...", emo: "抱枕", jaTalk: "ん…気持ちいい…もっと撫でて…？" },
        { act: "（你想要抽回手，奈却急得眼泪在眼眶里打转，带着哭腔死死抱住抱枕不放）", talk: "诶！？让...让我说请让你摸...这...这种事...别走...请摸摸我~~", emo: "哭哭", jaTalk: "えっ！？そんな…「触って」なんて言わせないでよ…行かないで、お願い…" }
      ],
      combo10: [
        { act: "（你连续疯狂戳了他 10 下，奈气得精致的小脸涨得通红，头顶心形呆毛彻底气成旋转风车）", talk: "哼！我绝——对不会理你了！", emo: "生气", jaTalk: "もう知らない！絶対口きかないからね！" }
      ]
    };

    async function initLive2D() {
      const canvas = document.getElementById('live2dCanvas');
      const stage = document.querySelector('.char-stage');

      live2dApp = new PIXI.Application({
        view: canvas,
        transparent: true,
        autoDensity: true,
        antialias: true,
        resolution: Math.max(window.devicePixelRatio || 1, 2),
        resizeTo: stage
      });

      try {
        live2dModel = await PIXI.live2d.Live2DModel.from('model/naihuangbao2.model3.json', {
          autoInteract: true
        });

        live2dApp.stage.addChild(live2dModel);

        baseScale = (stage.clientHeight * 1.15) / live2dModel.height;
        live2dModel.scale.set(baseScale);
        live2dModel.anchor.set(0.5, 0.5);

        live2dModel.x = stage.clientWidth * 0.50;
        live2dModel.y = stage.clientHeight * 0.53;

        try { live2dModel.expression("呆毛摆动"); } catch(e){}

        bindModelTouchInteractions();
        bindPixiNativePipeline();
      } catch (err) {
        console.error("Live2D 加载异常:", err);
      }
    }

    function bindModelTouchInteractions() {
      if (!live2dModel) return;
      live2dModel.interactive = true;
      live2dModel.buttonMode = true;

      live2dModel.on('pointerdown', (event) => {
        if (isLocked) return;

        const point = event.data.global;
        const localPoint = live2dModel.toLocal(point);
        
        let targetPart = 'body';
        if (localPoint.y < -120) targetPart = 'head';
        else if (localPoint.y >= -120 && localPoint.y <= -20) targetPart = 'horn';

        triggerTouchReaction(targetPart);
      });
    }

    function triggerTouchReaction(part) {
      clickComboCount++;
      if (comboResetTimer) clearTimeout(comboResetTimer);
      comboResetTimer = setTimeout(() => { clickComboCount = 0; }, 1500);

      let item = null;
      if (clickComboCount >= 10) {
        item = TOUCH_DIALOGUES.combo10[0];
        triggerChainLock();
        clickComboCount = 0;
      } else {
        const list = TOUCH_DIALOGUES[part] || TOUCH_DIALOGUES.body;
        const index = (clickComboCount - 1) % list.length;
        item = list[index];
      }

      setModelExpression(item.emo);

      scriptQueue = [
        { speaker: 'ACT', emo: item.emo, text: item.act },
        { speaker: 'NA', emo: item.emo, zh: item.talk, ja: item.jaTalk || item.talk }
      ];
      showSentence(0);
      statusText.textContent = clickComboCount > 1 ? `连击 x${clickComboCount}!` : "触碰互动";
    }

    function triggerChainLock() {
      isLocked = true;
      const overlay = document.getElementById('lockOverlay');
      const timerText = document.getElementById('lockTimerText');
      overlay.classList.add('show');

      let timeLeft = 5;
      timerText.textContent = `生气锁链锁定中... (${timeLeft}s)`;

      const lockInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerText.textContent = `生气锁链锁定中... (${timeLeft}s)`;
        } else {
          clearInterval(lockInterval);
          isLocked = false;
          overlay.classList.remove('show');
          setModelExpression("呆毛摆动");
        }
      }, 1000);
    }

    function bindPixiNativePipeline() {
      if (!live2dModel || !live2dModel.internalModel || !live2dModel.internalModel.coreModel) return;
      const core = live2dModel.internalModel.coreModel;
      const stage = document.querySelector('.char-stage');

      try { if (live2dModel.motion) live2dModel.motion('待机'); } catch (e) {}

      live2dApp.ticker.add((delta) => {
        lifeFrame += delta;

        if (lifeFrame >= nextBlinkFrame) {
          blinkValue -= 0.08 * delta;
          if (blinkValue <= 0) { blinkValue = 0; lifeFrame = 0; nextBlinkFrame = Math.floor(Math.random() * 120) + 90; }
        } else if (blinkValue < 1.0) {
          blinkValue = Math.min(1.0, blinkValue + 0.1 * delta);
        }

        currentCameraScaleMult += (targetCameraScaleMult - currentCameraScaleMult) * 0.08 * delta;
        currentCameraOffsetY += (targetCameraOffsetY - currentCameraOffsetY) * 0.08 * delta;
        live2dModel.scale.set(baseScale * currentCameraScaleMult);
        live2dModel.y = (stage.clientHeight * 0.53) + currentCameraOffsetY;

        if (isSpeaking) {
          mouthToggleTimer += delta;
          if (mouthToggleTimer > 9) { mouthTargetValue = (mouthTargetValue > 0.4) ? 0.1 : 0.85; mouthToggleTimer = 0; }
        } else { mouthTargetValue = 0; }
        mouthOpenValue += (mouthTargetValue - mouthOpenValue) * 0.25 * delta;

        try {
          core.setParameterValueById('ParamEyeLOpen', blinkValue);
          core.setParameterValueById('ParamEyeROpen', blinkValue);
          core.setParameterValueById('ParamMouthOpenY', mouthOpenValue);
          core.setParameterValueById('ParamMouthForm', 0.65);

          const time = lifeFrame * 0.04;
          if (isSpeaking) {
            core.setParameterValueById('ParamAngleZ', Math.sin(time * 1.6) * 7.5);
            core.setParameterValueById('ParamBodyAngleZ', Math.sin(time * 1.6) * 3.2);
            core.setParameterValueById('ParamAngleX', Math.cos(time * 1.6) * 4.5);
          } else {
            const headIdle = Math.sin(time * 0.8) * 2.2;
            core.setParameterValueById('ParamAngleZ', headIdle);
            core.setParameterValueById('ParamBodyAngleZ', headIdle * 0.5);
            core.setParameterValueById('ParamAngleX', headIdle * 0.4);
          }
          core.setParameterValueById('ParamBreath', Math.sin(time * 0.9) * 0.35 + 0.5);
        } catch (e) {}
      });
    }

    /* 真正的大特写半身贴屏缩放 + 表情精准映射 */
    function setModelExpression(emoName) {
      if (!live2dModel || !live2dModel.internalModel) return;

      if (emoName.includes("爱心眼") || emoName.includes("星星眼") || emoName.includes("抱枕")) {
        targetCameraScaleMult = 2.20; // 放大至半身贴屏大特写（匹配你提供的第二张图效果）
        targetCameraOffsetY = -60;
      } else if (emoName.includes("脸红") || emoName.includes("黑脸") || emoName.includes("生气") || emoName.includes("呆毛旋转")) {
        targetCameraScaleMult = 1.80;
        targetCameraOffsetY = -40;
      } else if (emoName.includes("哭哭")) {
        targetCameraScaleMult = 2.00;
        targetCameraOffsetY = -50;
      } else {
        targetCameraScaleMult = 1.0;
        targetCameraOffsetY = 0;
      }

      try {
        if (live2dModel.expression) live2dModel.expression(emoName);
        else if (live2dModel.expressionManager) live2dModel.expressionManager.setExpression(emoName);
      } catch (e) {}
    }

    function startModelLipSync() { isSpeaking = true; }
    function stopModelLipSync() { isSpeaking = false; }

    function drawPixelSheep() {
      const cvs = document.getElementById('sheepCanvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, 32, 32);
      ctx.fillStyle = '#fff'; ctx.fillRect(8, 10, 16, 14);
      ctx.fillStyle = '#ff6b98'; ctx.fillRect(14, 3, 4, 3);
    }
    drawPixelSheep();

    let playerName = localStorage.getItem('nai_player_name') || '';
    let playerPersona = localStorage.getItem('nai_player_persona') || '普通人类';

    function handleOpeningFlow() {
      setTimeout(() => {
        const sheepHeart = document.getElementById('sheepHeart');
        if(sheepHeart) sheepHeart.classList.add('pop');
        if (!playerName) {
          const p = document.getElementById('nameInputPanel');
          if(p) p.style.opacity = '1';
        } else {
          const s = document.getElementById('openingScreen');
          if(s) s.classList.add('hide');
        }
      }, 1500);
    }

    function submitPlayerProfile() {
      const nameVal = document.getElementById('initPlayerName').value.trim();
      const personaVal = document.getElementById('initPlayerPersona').value.trim() || '普通人类';
      if (!nameVal) { alert("请输入名字！"); return; }
      playerName = nameVal; playerPersona = personaVal;
      localStorage.setItem('nai_player_name', playerName);
      localStorage.setItem('nai_player_persona', playerPersona);
      initSystemPrompt();
      document.getElementById('openingScreen').classList.add('hide');
    }

    function resetOpeningProfile() {
      localStorage.removeItem('nai_player_name'); location.reload();
    }

    let chatHistory = [];
    function initSystemPrompt() {
      const promptText = `
【核心人设档案：奈（NA）】
姓名：奈（英文固定写作 NA，发音矫正为日音：な/na）
对话对象：${playerName || '你'}（身份：${playerPersona || '普通人类'}）
【字数与切片分页硬性规则】
1. 回复总字数 350~500 字。
2. 每段动作 [ACT:表情名] 30~40字；每段台词 [TALK:表情名] 0~15字。
【可用表情文件名（直接调用）】
生气, 脸红, 爱心眼, 哭哭, 星星眼, 抱枕, 圈圈眼, 黑脸, 棉花棒, 面纹, 呆毛摆动, 呆毛旋转
输出格式：
[ACT:表情文件名] 动作（30~40字）
[TALK:表情文件名] 中文台词（0~15字） | 日文台词 (请务必在竖线右侧提供地道的日语台词，以便语音引擎精准朗读)
`;
      chatHistory = [{ role: "system", content: promptText }];
    }

    let scriptQueue = [];
    let currentStepIndex = 0;
    let isTyping = false;
    let pendingUserInputs = [];
    let currentVoiceBlob = null;
    let audioPlayer = new Audio();

    const nameBadge = document.getElementById('nameBadge');
    const badgeName = document.getElementById('badgeName');
    const dialogueBox = document.getElementById('dialogueBox');
    const dialogueContent = document.getElementById('dialogueContent');
    const statusText = document.getElementById('statusText');
    const nextIndicator = document.getElementById('nextIndicator');
    const userInput = document.getElementById('userInput');

    function handleInputKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;
        pendingUserInputs.push(text);
        userInput.value = '';
        nameBadge.className = "char-name-badge user-badge";
        badgeName.textContent = playerName || "你";
        dialogueContent.className = "dialogue-content";
        dialogueContent.textContent = text;
        statusText.textContent = `已就绪`;
      }
    }

    function parseStoryScript(rawReply) {
      const lines = rawReply.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const queue = [];
      lines.forEach(line => {
        const actMatch = line.match(/^\[ACT:(.*?)\]\s*(.*)$/);
        const talkMatch = line.match(/^\[TALK:(.*?)\]\s*(.*)$/);
        if (actMatch) {
          queue.push({ speaker: 'ACT', emo: actMatch[1].trim(), text: actMatch[2].trim() });
        } else if (talkMatch) {
          const parts = talkMatch[2].split('|');
          queue.push({
            speaker: 'NA',
            emo: talkMatch[1].trim(),
            zh: (parts[0] || '').trim(),
            ja: (parts[1] || parts[0] || '').trim()
          });
        }
      });
      return queue.length > 0 ? queue : [{ speaker: 'NA', emo: '脸红', zh: "哼！不理你了~", ja: "もう知らない！" }];
    }

    function showSentence(index) {
      if (index < 0 || index >= scriptQueue.length) return;
      currentStepIndex = index;
      const item = scriptQueue[index];
      currentVoiceBlob = null;

      setModelExpression(item.emo);

      if (item.speaker === 'ACT') {
        nameBadge.className = "char-name-badge";
        nameBadge.style.opacity = '0.45';
        badgeName.textContent = "动作";
        dialogueContent.className = "dialogue-content action-mode";
        typeWriterEffect(item.text, false);
      } else {
        nameBadge.className = "char-name-badge";
        nameBadge.style.opacity = '1';
        badgeName.textContent = "奈";
        dialogueContent.className = "dialogue-content";
        typeWriterEffect(item.zh, true);
      }
      nextIndicator.style.display = (index < scriptQueue.length - 1) ? 'inline-block' : 'none';
      statusText.textContent = `第 ${index + 1}/${scriptQueue.length} 页`;
    }

    function typeWriterEffect(text, shouldTalk) {
      isTyping = true;
      dialogueContent.textContent = '';
      if (shouldTalk) startModelLipSync();

      let i = 0;
      const timer = setInterval(() => {
        if (i < text.length) {
          dialogueContent.textContent += text.charAt(i);
          i++;
        } else {
          clearInterval(timer);
          isTyping = false;
          if (audioPlayer.paused) stopModelLipSync();
        }
      }, 30);
    }

    function prevSentence(e) {
      e.stopPropagation();
      if (currentStepIndex > 0) { if (!audioPlayer.paused) { audioPlayer.pause(); stopModelLipSync(); } showSentence(currentStepIndex - 1); }
    }

    function onDialogueBoxClick() {
      if (isTyping) return;
      if (currentStepIndex < scriptQueue.length - 1) {
        if (!audioPlayer.paused) { audioPlayer.pause(); stopModelLipSync(); }
        showSentence(currentStepIndex + 1);
      }
    }

    async function synthesizeMiniMaxVoice(textToSpeak) {
      const chatKey = localStorage.getItem('nai_chat_key');
      if (!chatKey) { alert("请先设置 API Key！"); openConfigModal(); return; }
      const correctedText = textToSpeak.replace(/NA/g, 'な').replace(/Na/g, 'な').replace(/na/g, 'な');
      statusText.textContent = "🎙️ 合成中...";
      try {
        const res = await fetch(`https://api.minimax.chat/v1/t2a_v2?GroupId=YOUR_GROUP_ID`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${chatKey}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: "speech-2.8-hd", text: correctedText, stream: false, voice_setting: { voice_id: "moss_audio_120", speed: 1.0, vol: 1.0, pitch: 0 } })
        });
        const data = await res.json();
        if (data.data && data.data.audio) {
          const bytes = new Uint8Array(data.data.audio.match(/[\da-f]{2}/gi).map(h => parseInt(h, 16)));
          currentVoiceBlob = new Blob([bytes], { type: 'audio/mp3' });
          audioPlayer.src = URL.createObjectURL(currentVoiceBlob);
          audioPlayer.play();
          statusText.textContent = "🔊 说话中...";
        }
      } catch (err) { statusText.textContent = "合成出错"; }
    }

    function onPlayVoiceClick(e) {
      e.stopPropagation();
      const item = scriptQueue[currentStepIndex];
      if (!item || item.speaker !== 'NA') return;
      // 朗读时优先使用标准的纯日语发音文本（ja），确保 MiniMax 吐出地道日乙声线
      synthesizeMiniMaxVoice(item.ja || item.zh);
    }
    function onRetryVoiceClick(e) { onPlayVoiceClick(e); }
    function downloadCurrentVoice(e) { e.stopPropagation(); }

    let lastSentUserText = "";
    async function sendMessage(isReroll = false) {
      let textToSend = isReroll ? lastSentUserText : userInput.value.trim();
      if (!isReroll && textToSend) { userInput.value = ''; }
      if (!textToSend && pendingUserInputs.length === 0) return;
      if (!isReroll) textToSend = textToSend || pendingUserInputs.join('；');

      const chatKey = localStorage.getItem('nai_chat_key');
      if (!chatKey) { alert("请先设置 API Key！"); openConfigModal(); return; }

      statusText.textContent = "奈思考中...";
      chatHistory.push({ role: "user", content: `【${playerName}】: ${textToSend}` });

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${chatKey}` },
          body: JSON.stringify({ model: 'gpt-4o-mini', messages: chatHistory, temperature: 0.85 })
        });
        const resData = await response.json();
        const rawReply = resData.choices[0].message.content.trim();
        chatHistory.push({ role: "assistant", content: rawReply });

        scriptQueue = parseStoryScript(rawReply);
        if (scriptQueue.length > 0) showSentence(0);
      } catch (err) {
        dialogueContent.textContent = "网络连接失败，请检查 API 配置。";
        statusText.textContent = "连接异常";
      }
    }
    function onRerollStoryClick(e) { e.stopPropagation(); sendMessage(true); }

    const configModal = document.getElementById('configModal');
    const cfgPlayerName = document.getElementById('cfgPlayerName');
    const cfgChatKey = document.getElementById('cfgChatKey');

    function loadSavedConfig() {
      if (cfgPlayerName) cfgPlayerName.value = localStorage.getItem('nai_player_name') || '';
      if (cfgChatKey) cfgChatKey.value = localStorage.getItem('nai_chat_key') || '';
    }
    function openConfigModal() { loadSavedConfig(); configModal.style.display = 'flex'; }
    function closeConfigModal() { configModal.style.display = 'none'; }
    function saveConfig() {
      if (cfgPlayerName) localStorage.setItem('nai_player_name', cfgPlayerName.value.trim());
      if (cfgChatKey) localStorage.setItem('nai_chat_key', cfgChatKey.value.trim());
      closeConfigModal(); alert("配置已保存！");
    }

    loadSavedConfig();
    initSystemPrompt();
    handleOpeningFlow();
    window.addEventListener('DOMContentLoaded', () => { initLive2D(); });
  </script>
</body>
</html>
