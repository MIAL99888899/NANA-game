<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>奈的手机禁闭日常</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

  <!-- Live2D Cubism Core 及 Pixi 渲染引擎驱动 -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.8/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0d0914;
      overflow: hidden;
      font-family: "Zen Maru Gothic", "Kosugi Maru", "Yuanti SC", "圆体-简", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: radial-gradient(circle at 50% 25%, #382247 0%, #20132b 70%, #11081a 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .bg-decor {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 2px solid rgba(255, 180, 210, 0.25);
      border-radius: 28px;
      pointer-events: none;
      z-index: 1;
    }

    .top-header {
      position: absolute;
      top: 16px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 40;
    }
    .header-title {
      color: #ffb8d6;
      font-size: 13.5px;
      font-weight: 900;
      letter-spacing: 1px;
      opacity: 0.9;
    }
    .btn-config {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255, 180, 210, 0.4);
      color: #ffd8ea;
      font-size: 12px;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 12px;
      cursor: pointer;
    }
    .btn-config:active {
      transform: scale(0.92);
    }

    /* Live2D 画布容器 */
    .char-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    #live2dCanvas {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: auto;
    }

    /* 果冻对话框容器 */
    .dialogue-wrapper {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      z-index: 29;
      display: flex;
      flex-direction: column;
    }

    .char-name-badge {
      align-self: flex-start;
      margin-left: 20px;
      background: linear-gradient(135deg, #ff6fa3 0%, #d83d83 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      padding: 6px 18px 5px 16px;
      border-radius: 16px 16px 0 0;
      border: 3px solid #ffa4cc;
      border-bottom: none;
      box-shadow: 0 -3px 12px rgba(255, 111, 163, 0.4);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
      transition: all 0.2s ease;
    }
    .char-name-badge.user-badge {
      background: linear-gradient(135deg, #70a1ff 0%, #4776e6 100%);
      border-color: #a4c4ff;
      box-shadow: 0 -3px 12px rgba(71, 118, 230, 0.4);
    }

    .badge-icon {
      font-size: 14px;
      animation: pulseMini 1.2s infinite alternate;
    }
    @keyframes pulseMini {
      0% { transform: scale(1); }
      100% { transform: scale(1.3) rotate(10deg); }
    }

    .jelly-dialogue-box {
      position: relative;
      background: linear-gradient(180deg, rgba(46, 26, 61, 0.96) 0%, rgba(28, 14, 38, 0.98) 100%);
      border: 3.5px solid #ff9ec6;
      border-radius: 24px;
      padding: 14px 18px 10px 18px;
      min-height: 116px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6), 
                  inset 0 0 0 1.5px rgba(255, 255, 255, 0.18),
                  inset 0 4px 12px rgba(255, 158, 198, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .jelly-dialogue-box.bounce {
      transform: scale(0.97, 1.03);
    }

    .dialogue-content {
      color: #fff0f7;
      font-size: 15.5px;
      font-weight: 900;
      line-height: 1.6;
      letter-spacing: 0.6px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      min-height: 52px;
      max-height: 120px;
      overflow-y: auto;
    }
    .dialogue-content.action-mode {
      color: #e2b9d8;
      font-style: italic;
      font-size: 14.5px;
    }

    .dialogue-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1.5px dashed rgba(255, 180, 210, 0.2);
    }
    .footer-left {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .footer-tag {
      font-size: 10px;
      color: #c98baa;
      font-weight: 900;
      letter-spacing: 0.8px;
    }
    .footer-status {
      font-size: 10.5px;
      color: #ff80b3;
      font-weight: 900;
      max-width: 100px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer-right {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .btn-jelly-act {
      background: linear-gradient(135deg, rgba(255, 158, 198, 0.28) 0%, rgba(216, 61, 131, 0.28) 100%);
      border: 1.5px solid #ff9ec6;
      color: #fff0f7;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      box-shadow: 0 2px 6px rgba(255, 111, 163, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-jelly-act:active {
      transform: scale(0.9);
      background: #ff528c;
      color: #ffffff;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .next-indicator {
      font-size: 11px;
      color: #ff80b3;
      font-weight: 900;
      margin-left: 2px;
      animation: bounceNext 1.2s infinite ease-in-out;
      display: none;
    }
    @keyframes bounceNext {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* 底部输入区 */
    .input-bar-wrapper {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 35;
    }

    .chat-input {
      flex: 1;
      background: rgba(30, 16, 41, 0.92);
      border: 2px solid #d97fae;
      border-radius: 16px;
      padding: 0 14px;
      height: 44px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
      font-family: inherit;
    }
    .chat-input::placeholder {
      color: #8c5773;
      font-weight: normal;
      font-size: 12px;
    }
    .chat-input:focus {
      border-color: #ff9ec6;
    }

    .btn-send {
      background: linear-gradient(135deg, #ff6fa3 0%, #ff4785 100%);
      border: none;
      color: white;
      height: 44px;
      padding: 0 18px;
      border-radius: 16px;
      font-size: 13.5px;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-send:active {
      transform: scale(0.94);
    }

    /* 开屏小羊 */
    .opening-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #181124;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    .opening-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .sheep-track {
      position: relative;
      width: 100%;
      height: 140px;
    }

    .rolling-sheep-box {
      position: absolute;
      left: -100px;
      top: 25px;
      animation: rollAndBounce 3.0s cubic-bezier(0.25, 1, 0.35, 1) forwards;
      transform-origin: center bottom;
    }

    @keyframes rollAndBounce {
      0% { left: -100px; transform: translateY(0) scale(1); }
      60% { left: calc(50% - 40px); transform: translateY(0) scale(1); }
      68% { left: calc(50% - 40px); transform: translateY(-30px) scale(1.05, 1.15); }
      76% { left: calc(50% - 40px); transform: translateY(0) scale(1.2, 0.95); }
      85% { left: calc(50% - 40px); transform: translateY(-15px) scale(1.35, 1.45); }
      93% { left: calc(50% - 40px); transform: translateY(0) scale(1.48, 1.35); }
      100% { left: calc(50% - 40px); transform: translateY(0) scale(1.4); }
    }

    .pixel-sheep {
      image-rendering: pixelated;
      width: 80px;
      height: 80px;
      animation: rotateBody 3.0s cubic-bezier(0.25, 1, 0.35, 1) forwards;
    }

    @keyframes rotateBody {
      0% { transform: rotate(0deg); }
      60% { transform: rotate(720deg); }
      100% { transform: rotate(720deg); }
    }

    .sheep-heart {
      position: absolute;
      top: -18px;
      right: 4px;
      font-size: 22px;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.4s ease;
      z-index: 10;
    }
    .sheep-heart.pop {
      opacity: 1;
      transform: scale(1.2) translateY(-6px);
      animation: heartBlink 1.4s infinite alternate;
    }
    @keyframes heartBlink {
      0% { transform: scale(1) translateY(-6px); }
      100% { transform: scale(1.25) translateY(-10px); }
    }

    .name-input-panel {
      width: 84%;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.6s ease;
      margin-top: 12px;
    }
    .name-input-panel.show {
      opacity: 1;
      transform: translateY(0);
    }

    .name-input {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid #ff7ebb;
      border-radius: 14px;
      height: 42px;
      padding: 0 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      outline: none;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
      font-family: inherit;
    }
    .name-input::placeholder {
      color: #9f6583;
      font-size: 12.5px;
      font-weight: normal;
    }

    .name-btn {
      background: linear-gradient(135deg, #ff6fa3 0%, #d83d83 100%);
      border: none;
      color: white;
      height: 42px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(255, 71, 133, 0.4);
    }
    .name-btn:active {
      transform: scale(0.95);
    }

    .custom-select-wrap {
      position: relative;
      width: 100%;
    }
    .custom-select-wrap select {
      width: 100%;
      height: 34px;
      background: #14091c;
      border: 1.5px solid #ff7ebb;
      border-radius: 8px;
      padding: 0 30px 0 8px;
      color: #ffd6eb;
      font-size: 12px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      box-sizing: border-box;
    }
    .custom-select-arrow {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #ff7ebb;
      font-size: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 开屏小羊 -->
  <div class="opening-screen" id="openingScreen">
    <div class="sheep-track">
      <div class="rolling-sheep-box">
        <div class="sheep-heart" id="sheepHeart">💖</div>
        <canvas id="sheepCanvas" class="pixel-sheep" width="32" height="32"></canvas>
      </div>
    </div>

    <div class="name-input-panel" id="nameInputPanel">
      <input type="text" id="initPlayerName" class="name-input" placeholder="输入你的名字..." maxlength="12">
      <input type="text" id="initPlayerPersona" class="name-input" placeholder="输入你的人设（如：饲主/学生）..." maxlength="30">
      <button class="name-btn" onclick="submitPlayerProfile()">进入手机世界</button>
    </div>
  </div>

  <div class="viewport">
    <div class="bg-decor"></div>

    <div class="top-header">
      <span class="header-title" id="headerTitle">✨ Live2D · 奈的动态空间</span>
      <button class="btn-config" onclick="openConfigModal()">⚙️ 设置</button>
    </div>

    <!-- Live2D 画布 -->
    <div class="char-stage">
      <canvas id="live2dCanvas"></canvas>
    </div>

    <!-- 果冻对话框 -->
    <div class="dialogue-wrapper">
      <div class="char-name-badge" id="nameBadge">
        <span class="badge-icon">💖</span>
        <span id="badgeName">奈</span>
      </div>
      <div class="jelly-dialogue-box" id="dialogueBox" onclick="onDialogueBoxClick()">
        <div class="dialogue-content" id="dialogueContent">
          喂！你在玻璃外面看什么看啊？还不快点把本王子从这个奇怪的盒子里放出去！
        </div>
        <div class="dialogue-footer">
          <div class="footer-left">
            <span class="footer-tag" id="footerTag">NAI'S DIALOGUE</span>
            <span class="footer-status" id="statusText">等待回应...</span>
          </div>
          <div class="footer-right">
            <button class="btn-jelly-act" onclick="prevSentence(event)" title="回退上一句">🐾 上句</button>
            <button class="btn-jelly-act" id="btnPlayVoice" onclick="onPlayVoiceClick(event)" title="朗读当前屏幕上的短句">🌸 朗读</button>
            <button class="btn-jelly-act" id="btnDownloadVoice" onclick="downloadCurrentVoice(event)" style="display:none;">💌 下载</button>
            <button class="btn-jelly-act" id="btnRetryVoice" onclick="onRetryVoiceClick(event)">✨ 语音</button>
            <button class="btn-jelly-act" id="btnRerollStory" onclick="onRerollStoryClick(event)">💫 重答</button>
            <span class="next-indicator" id="nextIndicator">轻触继续 ▼</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部输入栏 -->
    <div class="input-bar-wrapper">
      <input type="text" id="userInput" class="chat-input" placeholder="输入一句话，按回车放入对话框..." onkeydown="handleInputKeyDown(event)">
      <button class="btn-send" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- ⚙️ 设置弹窗 -->
  <div id="configModal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 99999; display: none; align-items: center; justify-content: center; pointer-events: auto;">
    <div style="width: 92%; max-width: 420px; max-height: 90vh; overflow-y: auto; background: #231430; border: 3px solid #ff9ec6; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; font-family: sans-serif;">
      
      <div style="color: #ffb8d6; font-size: 16px; font-weight: 900; text-align: center;">⚙️ 核心设置</div>

      <div style="background: rgba(0,0,0,0.25); border: 1.5px solid #ff7ebb; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: #ff9ec6; font-size: 12.5px; font-weight: 900;">👤 玩家身份档案改写</span>
          <button type="button" onclick="resetOpeningProfile()" style="background: #ba5bb0; color: #fff; border: none; border-radius: 6px; font-size: 10px; font-weight: bold; padding: 2px 6px; cursor: pointer;">✨ 重置开屏身份</button>
        </div>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="cfgPlayerName" placeholder="玩家姓名" style="flex: 1; background: #14091c; border: 1.5px solid #8e496d; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
          <input type="text" id="cfgPlayerPersona" placeholder="玩家人设身份" style="flex: 1.6; background: #14091c; border: 1.5px solid #8e496d; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
        </div>
      </div>

      <div style="background: rgba(0,0,0,0.25); border: 1.5px solid #e06bb2; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
        <div style="color: #ff9ec6; font-size: 12.5px; font-weight: 900;">🖋️ 剧情演出与文风定制</div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: #ffd6eb; font-size: 11px;">单轮演出段落行数:</span>
          <div style="display: flex; align-items: center; gap: 4px;">
            <input type="range" id="cfgScriptLines" min="2" max="6" step="1" value="4" oninput="document.getElementById('linesValText').textContent = this.value + '行'" style="width: 80px; accent-color: #ff7ebb;">
            <span id="linesValText" style="color: #ffb8d6; font-size: 11px; font-weight: bold; width: 25px;">4行</span>
          </div>
        </div>
        <textarea id="cfgCustomStyle" rows="2" placeholder="默认采用官方日乙轻小说文风，可在此输入自定义文风覆盖..." style="background: #14091c; border: 1.5px solid #e06bb2; border-radius: 8px; color: #fff; font-size: 11px; padding: 6px; outline: none; font-family: inherit; resize: none;"></textarea>
      </div>

      <div style="background: rgba(0,0,0,0.25); border: 1.5px solid #8e496d; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
        <div style="color: #ff9ec6; font-size: 12.5px; font-weight: 900;">🧠 对话模型配置</div>
        <input type="text" id="cfgChatBase" placeholder="Base URL: https://api.openai.com/v1" style="background: #14091c; border: 1.5px solid #8e496d; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
        <input type="password" id="cfgChatKey" placeholder="API Key: sk-..." style="background: #14091c; border: 1.5px solid #8e496d; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: #ffd6eb; font-size: 11px; font-weight: bold;">模型 (Model):</span>
          <button type="button" onclick="fetchChatModels()" style="background: #ff528c; color: white; border: none; border-radius: 6px; font-size: 10.5px; font-weight: bold; padding: 2px 8px; cursor: pointer;">🔄 拉取</button>
        </div>
        <div class="custom-select-wrap">
          <select id="cfgChatModelSelect" onchange="document.getElementById('cfgChatModel').value = this.value">
            <option value="">-- 点选模型或下方手动输入 --</option>
          </select>
          <div class="custom-select-arrow">▼</div>
        </div>
        <input type="text" id="cfgChatModel" placeholder="gpt-4o-mini" style="background: #14091c; border: 1.5px solid #8e496d; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
      </div>

      <div style="background: rgba(0,0,0,0.25); border: 1.5px solid #ba5bb0; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
        <div style="color: #ffb8d6; font-size: 12.5px; font-weight: 900;">🎙️ MiniMax 配音配置</div>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="cfgMiniMaxGroupId" placeholder="GroupId" style="flex: 1; background: #14091c; border: 1.5px solid #ba5bb0; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
          <input type="password" id="cfgMiniMaxVoiceKey" placeholder="语音 Key (留空共用对话Key)" style="flex: 1.4; background: #14091c; border: 1.5px solid #ba5bb0; border-radius: 8px; height: 32px; padding: 0 8px; color: #fff; font-size: 12px; outline: none;">
        </div>
        <div class="custom-select-wrap">
          <select id="cfgMiniMaxVoiceModelSelect" onchange="document.getElementById('cfgMiniMaxVoiceModel').value = this.value">
            <option value="speech-2.8-hd">speech-2.8-hd (高清2.8代 推荐)</option>
            <option value="speech-01-turbo">speech-01-turbo (极速高响应)</option>

    /* ============================================================
     * 1. 核心安全解密与 Blob 预加载机制 (绝不报错方案)

    const DECRYPT_KEY = 0x7B;

    function decryptArrayBuffer(buffer) {
      const data = new Uint8Array(buffer);
      const limit = Math.min(data.length, 1024);
      for (let i = 0; i < limit; i++) {
        data[i] ^= DECRYPT_KEY;
      }
      return data;
    }

    async function loadAndDecryptAsset(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`加载文件失败: ${url} (HTTP ${resp.status})`);
      const rawBuf = await resp.arrayBuffer();
      return decryptArrayBuffer(rawBuf);
    }

    /* ============================================================

     * ============================================================ */
    let live2dApp = null;

    async function initLive2D() {
      const canvas = document.getElementById('live2dCanvas');
      const stage = document.querySelector('.char-stage');

      live2dApp = new PIXI.Application({
        view: canvas,
        transparent: true,
        autoDensity: true,
        resizeTo: stage
      });

      try {
        console.log("正在从 model/ 读取加密模型配置...");
        // 1. 读取配置文件
        const jsonResp = await fetch('model/naihuangbao2.model3.json');
        if (!jsonResp.ok) throw new Error(`找不到配置文件 model/naihuangbao2.model3.json (HTTP ${jsonResp.status})`);
        const modelJson = await jsonResp.json();

        // 2. 解密 .moc3 核心文件并转为 Blob URL
        const mocPath = 'model/' + modelJson.FileReferences.Moc;
        console.log("正在解密核心数据:", mocPath);
        const decMocBytes = await loadAndDecryptAsset(mocPath);
        const mocBlob = new Blob([decMocBytes], { type: 'application/octet-stream' });
        const mocBlobUrl = URL.createObjectURL(mocBlob);
        modelJson.FileReferences.Moc = mocBlobUrl;

        // 3. 解密所有材质贴图并转为 Blob URL
        const textures = modelJson.FileReferences.Textures;
        for (let i = 0; i < textures.length; i++) {
          const texPath = 'model/' + textures[i];
          console.log(`正在解密贴图 [${i + 1}/${textures.length}]:`, texPath);
          const decTexBytes = await loadAndDecryptAsset(texPath);
          const texBlob = new Blob([decTexBytes], { type: 'image/png' });
          textures[i] = URL.createObjectURL(texBlob);
        }

        // 4. 将配置文件以 Blob URL 喂给 Pixi Live2D 引擎
        const modifiedJsonBlob = new Blob([JSON.stringify(modelJson)], { type: 'application/json' });
        const finalJsonUrl = URL.createObjectURL(modifiedJsonBlob);

        live2dModel = await PIXI.live2d.Live2DModel.from('model/naihuangbao2.model3.json', {
          autoInteract: false
        });

        live2dApp.stage.addChild(live2dModel);

        // 视口比例与位置自适应
        const scaleX = (stage.clientWidth * 0.95) / live2dModel.width;
        const scaleY = (stage.clientHeight * 0.95) / live2dModel.height;
        const finalScale = Math.min(scaleX, scaleY);

        live2dModel.scale.set(finalScale);
        live2dModel.anchor.set(0.5, 0.5);
        live2dModel.x = stage.clientWidth / 2;
        live2dModel.y = stage.clientHeight / 2 + 30;

        console.log("✅ Live2D 动态模型内存解密与渲染成功！");
      } catch (err) {
        console.error("Live2D 加载异常:", err);
      }
    }

    const EXP_MAP = {

    let scriptQueue = [];

    function handleInputKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();

    function parseStoryScript(rawReply) {
      const lines = rawReply.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const queue = [];

      lines.forEach(line => {
        const actMatch = line.match(/^\[ACT:([A-Z0-9_]+)\]\s*(.*)$/);
        const talkMatch = line.match(/^\[TALK:([A-Z0-9_]+)\]\s*(.*)$/);

        if (actMatch) {
          queue.push({
            speaker: 'ACT',
            emo: actMatch[1],
            text: actMatch[2].trim()
          });
        } else if (talkMatch) {
          const parts = talkMatch[2].split('|');
          queue.push({
            speaker: 'NAI',
            emo: talkMatch[1],
            zh: (parts[0] || '').trim(),
            ja: (parts[1] || parts[0] || '').trim()
          });
        } else {
          queue.push({
            speaker: 'NAI',
            emo: 'IDLE',
            zh: line,
            ja: line
          });
        }
      });
      return queue;
    }

    function showSentence(index) {
      if (index < 0 || index >= scriptQueue.length) return;

      currentStepIndex = index;
      const item = scriptQueue[index];
      currentVoiceBlob = null;
      btnDownloadVoice.style.display = 'none';

      setModelExpression(item.emo);

      if (item.speaker === 'ACT') {
        nameBadge.className = "char-name-badge";

        badgeName.textContent = "动作";
        dialogueContent.className = "dialogue-content action-mode";

      } else {

        badgeName.textContent = "奈";
        dialogueContent.className = "dialogue-content";
        btnPlayVoice.style.opacity = '1';
        btnRetryVoice.style.opacity = '1';
        typeWriterEffect(item.zh, true);
      }

      nextIndicator.style.display = (index < scriptQueue.length - 1) ? 'inline-block' : 'none';
      statusText.textContent = `第 ${index + 1}/${scriptQueue.length} 句`;

    function typeWriterEffect(text, shouldTalk) {
      isTyping = true;

      if (shouldTalk) {

      let i = 0;
      const timer = setInterval(() => {
        if (i < text.length) {
          dialogueContent.textContent += text.charAt(i);

        } else {
          clearInterval(timer);
          isTyping = false;
          if (audioPlayer.paused) {
            stopModelLipSync();
          }

    function prevSentence(e) {
      e.stopPropagation();

        showSentence(currentStepIndex - 1);

        showSentence(currentStepIndex + 1);

    }

    async function synthesizeMiniMaxVoice(textToSpeak) {
      const chatKey = localStorage.getItem('nai_chat_key');
      const voiceKey = localStorage.getItem('nai_minimax_voice_key');
      const mmKey = voiceKey || chatKey;
      const mmGroup = localStorage.getItem('nai_minimax_group');
      const mmModel = localStorage.getItem('nai_minimax_voice_model') || 'speech-2.8-hd';
      const voiceId = localStorage.getItem('nai_minimax_voice') || 'moss_audio_120';
      const speed = parseFloat(localStorage.getItem('nai_minimax_voice_speed') || '1.0');
      const pitch = parseInt(localStorage.getItem('nai_minimax_voice_pitch') || '0', 10);

      if (!mmKey || !mmGroup) {
        alert("请先在设置中配置 MiniMax API Key 和 Group ID！");
        openConfigModal();
        return;
      }

      statusText.textContent = "🎙️ 合成中...";

      try {
        const res = await fetch(`https://api.minimax.chat/v1/t2a_v2?GroupId=${encodeURIComponent(mmGroup)}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${mmKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: mmModel,
            text: textToSpeak,
            stream: false,
            voice_setting: { voice_id: voiceId, speed: speed, vol: 1.0, pitch: pitch },
            audio_setting: { sample_rate: 32000, bitrate: 128000, format: "mp3", channel: 1 }
          })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.data && data.data.audio) {
          const hex = data.data.audio;
          const bytes = new Uint8Array(hex.match(/[\da-f]{2}/gi).map(h => parseInt(h, 16)));
          currentVoiceBlob = new Blob([bytes], { type: 'audio/mp3' });

          audioPlayer.src = URL.createObjectURL(currentVoiceBlob);
          audioPlayer.play();
          statusText.textContent = "🔊 正在说话...";
          btnDownloadVoice.style.display = 'inline-flex';

          audioPlayer.onplay = () => { startModelLipSync(); };
          audioPlayer.onended = () => { 
            stopModelLipSync();
            statusText.textContent = "播放完毕"; 
          };
        } else {
          statusText.textContent = "合成无音频";
        }
      } catch (err) {
        console.error(err);
        statusText.textContent = "合成出错";
      }
    }

    function onPlayVoiceClick(e) {
      e.stopPropagation();
      const item = scriptQueue[currentStepIndex];
      if (!item || item.speaker !== 'NAI') {
        statusText.textContent = "动作描写无需朗读";
        return;
      }
      if (currentVoiceBlob && audioPlayer.src) {
        audioPlayer.currentTime = 0;
        audioPlayer.play();
        return;
      }
      const lang = localStorage.getItem('nai_minimax_voice_lang') || 'ja';
      const textToSpeak = (lang === 'zh') ? item.zh : item.ja;
      synthesizeMiniMaxVoice(textToSpeak);
    }

    function onRetryVoiceClick(e) {
      e.stopPropagation();
      const item = scriptQueue[currentStepIndex];
      if (!item || item.speaker !== 'NAI') return;
      const lang = localStorage.getItem('nai_minimax_voice_lang') || 'ja';
      const textToSpeak = (lang === 'zh') ? item.zh : item.ja;
      synthesizeMiniMaxVoice(textToSpeak);
    }

    function downloadCurrentVoice(e) {
      e.stopPropagation();
      if (!currentVoiceBlob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(currentVoiceBlob);
      a.download = `奈_${playerName}_${Date.now()}.mp3`;
      a.click();
    }

    /* ============================================================
     * 9. 对话与剧情
     * ============================================================ */
    let lastSentUserText = "";

    async function sendMessage(isReroll = false) {
      let textToSend = "";
      if (isReroll) {
        textToSend = lastSentUserText;
      } else {
        const inputVal = userInput.value.trim();
        if (inputVal) {
          pendingUserInputs.push(inputVal);
          userInput.value = '';
        }
        if (pendingUserInputs.length === 0) return;
        textToSend = pendingUserInputs.join('；');
        pendingUserInputs = [];
        lastSentUserText = textToSend;
      }

      const chatKey = localStorage.getItem('nai_chat_key');
      const chatBase = localStorage.getItem('nai_chat_base') || 'https://api.openai.com/v1';
      const chatModel = localStorage.getItem('nai_chat_model') || 'gpt-4o-mini';

      if (!chatKey) {
        alert("请先点击右上角 ⚙️ 设置 API Key！");
        openConfigModal();
        return;
      }

      statusText.textContent = isReroll ? "💫 重新思考中..." : "奈思考中...";
      
      if (!isReroll) {
        chatHistory.push({ role: "user", content: `【${playerName}】: ${textToSend}` });
        roundCount++;
        checkAndTriggerMemorySummary();
      }

      try {
        const response = await fetch(chatBase.replace(/\/+$/, '') + '/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${chatKey}`
          },
          body: JSON.stringify({
            model: chatModel,
            messages: chatHistory,
            temperature: 0.85
          })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const resData = await response.json();
        const rawReply = resData.choices[0].message.content.trim();

        if (isReroll) {
          chatHistory[chatHistory.length - 1] = { role: "assistant", content: rawReply };
        } else {
          chatHistory.push({ role: "assistant", content: rawReply });
        }

        scriptQueue = parseStoryScript(rawReply);
        if (scriptQueue.length > 0) {
          showSentence(0);
        }

      } catch (err) {
        console.error(err);
        dialogueContent.textContent = "网络连接失败，请检查你的 API 配置。";
        statusText.textContent = "连接异常";
      }
    }

    function onRerollStoryClick(e) {
      e.stopPropagation();
      if (!lastSentUserText) {
        alert("暂无上一轮对话可重答！");
        return;
      }
      sendMessage(true);
    }

    async function checkAndTriggerMemorySummary() {
      const summaryRounds = parseInt(localStorage.getItem('nai_summary_rounds') || '8', 10);
      if (roundCount >= summaryRounds) {
        roundCount = 0;
        const chatKey = localStorage.getItem('nai_chat_key');
        const chatBase = localStorage.getItem('nai_chat_base') || 'https://api.openai.com/v1';
        const chatModel = localStorage.getItem('nai_chat_model') || 'gpt-4o-mini';
        const summaryPromptTpl = localStorage.getItem('nai_summary_prompt') || '请简短总结双方核心进展、约定与好感度。';

        try {
          const summarizeMsgs = [
            ...chatHistory.slice(1),
            { role: "user", content: `系统指令：${summaryPromptTpl}` }
          ];
          const res = await fetch(chatBase.replace(/\/+$/, '') + '/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${chatKey}` },
            body: JSON.stringify({ model: chatModel, messages: summarizeMsgs, temperature: 0.3 })
          });
          if (res.ok) {
            const data = await res.json();
            compressedMemory = data.choices[0].message.content.trim();
            const recent = chatHistory.slice(-4);
            initSystemPrompt();
            chatHistory = [chatHistory[0], ...recent];
          }
        } catch (e) {
          console.warn("记忆压缩失败:", e);
        }
      }
    }

    function exportChatHistory() {
      let exportText = `=== 奈的手机禁闭日常 - 互动档案 ===\n`;
      exportText += `玩家: ${playerName} (${playerPersona})\n`;
      exportText += `导出时间: ${new Date().toLocaleString()}\n`;
      exportText += `----------------------------------------\n\n`;

      chatHistory.forEach(item => {
        if (item.role === 'user') {
          exportText += `${item.content}\n\n`;
        } else if (item.role === 'assistant') {
          exportText += `【奈】:\n${item.content}\n\n`;
        }
      });

      const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `奈的记忆_${playerName}_${Date.now()}.txt`;
      a.click();
    }

    /* ============================================================
     * 10. 设置面板数据绑定
     * ============================================================ */
    const configModal = document.getElementById('configModal');
    const cfgPlayerName = document.getElementById('cfgPlayerName');
    const cfgPlayerPersona = document.getElementById('cfgPlayerPersona');
    const cfgScriptLines = document.getElementById('cfgScriptLines');
    const linesValText = document.getElementById('linesValText');
    const cfgCustomStyle = document.getElementById('cfgCustomStyle');

    const cfgChatBase = document.getElementById('cfgChatBase');
    const cfgChatKey = document.getElementById('cfgChatKey');
    const cfgChatModel = document.getElementById('cfgChatModel');
    const cfgChatModelSelect = document.getElementById('cfgChatModelSelect');

    const cfgMiniMaxGroupId = document.getElementById('cfgMiniMaxGroupId');
    const cfgMiniMaxVoiceKey = document.getElementById('cfgMiniMaxVoiceKey');
    const cfgMiniMaxVoiceModel = document.getElementById('cfgMiniMaxVoiceModel');
    const cfgMiniMaxVoiceModelSelect = document.getElementById('cfgMiniMaxVoiceModelSelect');
    const cfgVoiceLang = document.getElementById('cfgVoiceLang');
    const cfgVoiceId = document.getElementById('cfgVoiceId');
    const cfgVoiceSpeed = document.getElementById('cfgVoiceSpeed');
    const cfgVoicePitch = document.getElementById('cfgVoicePitch');
    const speedValText = document.getElementById('speedValText');
    const pitchValText = document.getElementById('pitchValText');

    const cfgSummaryRounds = document.getElementById('cfgSummaryRounds');
    const cfgSummaryPrompt = document.getElementById('cfgSummaryPrompt');
    const fetchStatus = document.getElementById('fetchStatus');

    function loadSavedConfig() {
      cfgPlayerName.value = localStorage.getItem('nai_player_name') || '';
      cfgPlayerPersona.value = localStorage.getItem('nai_player_persona') || '普通人类';

      const savedLines = localStorage.getItem('nai_script_lines') || '4';
      cfgScriptLines.value = savedLines;
      linesValText.textContent = savedLines + '行';

      cfgCustomStyle.value = localStorage.getItem('nai_custom_style') || '';

      cfgChatBase.value = localStorage.getItem('nai_chat_base') || 'https://api.openai.com/v1';
      cfgChatKey.value = localStorage.getItem('nai_chat_key') || '';
      cfgChatModel.value = localStorage.getItem('nai_chat_model') || 'gpt-4o-mini';

      cfgMiniMaxGroupId.value = localStorage.getItem('nai_minimax_group') || '';
      cfgMiniMaxVoiceKey.value = localStorage.getItem('nai_minimax_voice_key') || '';
      
      const savedModel = localStorage.getItem('nai_minimax_voice_model') || 'speech-2.8-hd';
      cfgMiniMaxVoiceModel.value = savedModel;
      cfgMiniMaxVoiceModelSelect.value = savedModel;

      cfgVoiceLang.value = localStorage.getItem('nai_minimax_voice_lang') || 'ja';
      cfgVoiceId.value = localStorage.getItem('nai_minimax_voice') || 'moss_audio_120';
      
      const savedSpeed = localStorage.getItem('nai_minimax_voice_speed') || '1.0';
      cfgVoiceSpeed.value = savedSpeed;
      speedValText.textContent = savedSpeed + 'x';

      const savedPitch = localStorage.getItem('nai_minimax_voice_pitch') || '0';
      cfgVoicePitch.value = savedPitch;
      pitchValText.textContent = savedPitch;

      cfgSummaryRounds.value = localStorage.getItem('nai_summary_rounds') || '8';
      cfgSummaryPrompt.value = localStorage.getItem('nai_summary_prompt') || '请以简短客观的条目，总结双方发生的核心事件、好感度增减、约定与称呼变化。';
    }

    function openConfigModal() { 
      loadSavedConfig();
      configModal.style.display = 'flex'; 
    }
    function closeConfigModal() { configModal.style.display = 'none'; }

    function saveConfig() {
      playerName = cfgPlayerName.value.trim() || '你';
      playerPersona = cfgPlayerPersona.value.trim() || '普通人类';
      localStorage.setItem('nai_player_name', playerName);
      localStorage.setItem('nai_player_persona', playerPersona);

      localStorage.setItem('nai_script_lines', cfgScriptLines.value);
      localStorage.setItem('nai_custom_style', cfgCustomStyle.value);

      localStorage.setItem('nai_chat_base', cfgChatBase.value.trim());
      localStorage.setItem('nai_chat_key', cfgChatKey.value.trim());
      localStorage.setItem('nai_chat_model', cfgChatModel.value.trim());

      localStorage.setItem('nai_minimax_group', cfgMiniMaxGroupId.value.trim());
      localStorage.setItem('nai_minimax_voice_key', cfgMiniMaxVoiceKey.value.trim());
      localStorage.setItem('nai_minimax_voice_model', cfgMiniMaxVoiceModel.value.trim());
      localStorage.setItem('nai_minimax_voice_lang', cfgVoiceLang.value);
      localStorage.setItem('nai_minimax_voice', cfgVoiceId.value.trim());
      localStorage.setItem('nai_minimax_voice_speed', cfgVoiceSpeed.value);
      localStorage.setItem('nai_minimax_voice_pitch', cfgVoicePitch.value);

      localStorage.setItem('nai_summary_rounds', cfgSummaryRounds.value);
      localStorage.setItem('nai_summary_prompt', cfgSummaryPrompt.value.trim());

      initSystemPrompt();
      closeConfigModal();
      alert("所有配置已保存并实时生效！");
    }

    async function fetchChatModels() {
      const baseUrl = cfgChatBase.value.trim();
      const apiKey = cfgChatKey.value.trim();
      if (!baseUrl || !apiKey) {
        fetchStatus.textContent = "请先填写 Base URL 和 API Key！";
        return;
      }
      fetchStatus.textContent = "拉取中...";
      try {
        const res = await fetch(baseUrl.replace(/\/+$/, '') + '/models', {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${apiKey}` }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const resData = await res.json();
        let list = Array.isArray(resData.data) ? resData.data.map(i => i.id) : [];
        if (!list.length) throw new Error("无数据");
        cfgChatModelSelect.innerHTML = '<option value="">-- 请点选拉取到的模型 --</option>';
        list.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m; opt.textContent = m;
          cfgChatModelSelect.appendChild(opt);
        });
        fetchStatus.textContent = `✅ 成功拉取 ${list.length} 个模型`;
      } catch (e) {
        fetchStatus.textContent = "拉取失败，可直接手动输入模型名";
      }
    }

    // 页面初始化
    loadSavedConfig();
    initSystemPrompt();
    handleOpeningFlow();
    window.addEventListener('DOMContentLoaded', () => {
      initLive2D();
    });
  </script>
</body>
</html>
